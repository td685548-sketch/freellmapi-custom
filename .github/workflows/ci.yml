name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR/branch supersedes the run in flight. Runs on
# main are never cancelled so every merged commit keeps a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent jobs run in parallel, so the pipeline takes as long as the
  # slowest one instead of the sum of all steps.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # server + cli only; the client has its own backlog of ESLint violations
      # and is brought in under a separate change.
      - name: Lint
        run: npm run lint

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the Node 22 LTS only. Pushes to main run the full
        # supported range (package.json engines: >=20.18 <25): 20 is the
        # baseline that has historically caught crashes newer local Node
        # versions hid, 24 is what the Docker image ships.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["20","22","24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Load compiled server with plain Node
        run: node --input-type=module -e "await import('./server/dist/app.js')"

  test-server:
    name: Test server (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the Node 22 LTS only. Pushes to main run the full
        # supported range (package.json engines: >=20.18 <25): 20 is the
        # baseline that has historically caught crashes newer local Node
        # versions hid, 24 is what the Docker image ships.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["20","22","24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repo scripts and hooks
        run: npm run test:bootstrap && npm run test:hooks

      - name: Check migration round trip
        run: npm run test:migrations

      # COVERAGE makes the server suite collect coverage inside this run rather
      # than running the whole suite a second time. Only the Node 22 leg sets
      # it, so the other legs keep uninstrumented timings. Reporting only,
      # there are no thresholds and coverage never fails the build.
      - name: Run server tests
        env:
          COVERAGE: ${{ matrix.node-version == '22' && '1' || '' }}
        run: npm run test -w server

  test-cli:
    name: Test CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the Node 22 LTS only. Pushes to main run the full
        # supported range (package.json engines: >=20.18 <25): 20 is the
        # baseline that has historically caught crashes newer local Node
        # versions hid, 24 is what the Docker image ships.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["20","22","24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CLI tests
        run: npm run test -w cli

  test-client:
    name: Test client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the Node 22 LTS only. Pushes to main run the full
        # supported range (package.json engines: >=20.18 <25): 20 is the
        # baseline that has historically caught crashes newer local Node
        # versions hid, 24 is what the Docker image ships.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["20","22","24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm run test -w client --if-present
